name: RNS Screener

on:
  # GitHub's own "schedule" trigger has proven unreliable for this repo
  # (observed 5-9 hour delays) - kept here only as a backup. The real
  # triggers are external cron-job.org jobs hitting the repository_dispatch
  # webhook below, once in the morning and once around midday. screener.py
  # tracks which announcements it's already processed each day (see
  # rns_screener/state.py), so it's safe to call this any number of times a
  # day - each run only handles what's new, and retries any X posts that
  # got rejected earlier, rather than resending everything.
  schedule:
    - cron: "30 6 * * 1-5"
    - cron: "30 7 * * 1-5"
  repository_dispatch:
    types: [morning-run]
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed to commit the day's processed-announcement state back to the repo

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          UK_DATE=$(TZ='Europe/London' date +%Y-%m-%d)
          python screener.py --date "$UK_DATE"

      - name: Record state
        run: |
          git config user.name "rns-screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add processed_ids.json skipped_x_posts.json
          git commit -m "Update state after run" || echo "Nothing to commit"
          git push
